name: ${OOGIES_PROJECT:-oogies}

services:
  viewer:
    image: ${OOGIES_IMAGE:?Select a fixed release image}
    platform: linux/amd64
    pull_policy: never
    init: true
    user: "${OOGIES_UID:?Set the host user ID}:${OOGIES_GID:?Set the host group ID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    tmpfs:
      - /tmp:rw,exec,nosuid,size=128m
    ports:
      - "127.0.0.1:${OOGIES_PORT:-8088}:8088"
    volumes:
      - type: bind
        source: ./.local/nvr-config.json
        target: /configuration/nvr.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./.local/nvr-credentials.json
        target: /credentials/nvr.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./.local/exports
        target: /exports
        bind: {create_host_path: false}
      - type: bind
        source: ./.local/output
        target: /output
        bind: {create_host_path: false}
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import json;
          from urllib.request import urlopen;
          s=json.load(urlopen('http://127.0.0.1:8088/api/status',timeout=3));
          assert 'sdk_login_calls' in s and 'sdk_adapter' in s
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
